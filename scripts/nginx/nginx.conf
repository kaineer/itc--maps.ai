server {
    listen 3000;
    server_name localhost;
    root /app/data;
    index index.html;

    # Gzip сжатие для улучшения производительности
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Для файлов с хешами в имени (обычно создаются при сборке) - добавляем долгий кэш
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Для всех остальных запросов - отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Заголовки для SPA
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Опционально: если нужны логи
    access_log /var/log/nginx/app-access.log;
    error_log /var/log/nginx/app-error.log;
}
